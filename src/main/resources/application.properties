quarkus.application.name=registry

# registry related
thisapp.baseAddress=${APP_BASE_URL:http://localhost:8080/}
ivoa.registry.authority=authority.changeme
ivoa.dc.name=pubreg
ivoa.dc.description=This is a registry
ivoa.dc.title=Publishing Registry
ivoa.dc.reference-url=http://localhost:8080/
ivoa.dc.authority=authority.changeme
ivoa.dc.organisation-name=Organization
ivoa.dc.contact-name=Contact Name
ivoa.dc.contact-email=Contact E-mail.
ivoa.dc.contact-telephone=Contact Telephone number


# RofR (Registry of Registries) harvesting
# Set ivoa.registry.harvesting.cron to a quarkus cron expression (e.g. "0 */10 * * * ?") to enable scheduled harvesting (setting to off will only harvest on request)
ivoa.registry.harvesting.rofr-url=http://rofr.ivoa.net/oai
ivoa.registry.harvesting.rofr-use-local=true
# cron expression for harvesting (default is 2am every day)
#ivoa.registry.harvesting.cron=0 0 2 * * ?
#use this for testing to harvest every 2 minutes
#ivoa.registry.harvesting.cron=0 */2 * * * ?
ivoa.registry.harvesting.cron=off

# Recursive source discovery settings
# Whether to discover child registries from harvested resource records
ivoa.registry.harvesting.discovery.enabled=false
# Maximum total number of sources (including seed) that will be persisted
ivoa.registry.harvesting.discovery.max-sources=100
# Maximum hop distance from the seed (0 = seed only, 1 = direct children, …)
ivoa.registry.harvesting.discovery.max-depth=3
# Maximum number of new sources accepted in a single harvest run
ivoa.registry.harvesting.discovery.max-per-run=5
# Whether to perform XML validation on harvested records from discovered sources (note switching this on will potentially lead errors from non-compliant sources and thus fewer harvested records)
ivoa.registry.harvesting.discovery.do-xml-validation=false


quarkus.http.port=8080
quarkus.http.test-port=8085
quarkus.jackson.serialization-inclusion=non_empty

quarkus.qute.suffixes=xml,html,txt,qute.html,qute.txt

#quarkus.config.log.values=true
#quarkus.log.category."io.smallrye.config".level=DEBUG

# Enable Basic Auth
quarkus.http.auth.basic=true

# Security  - see https://quarkus.io/guides/security-properties
quarkus.security.users.embedded.enabled=true
#cannot combine plain text passwords with realm change
#passwords generated with `echo -n username:realm:password | md5`
#
quarkus.security.users.embedded.plain-text=true
#plain text passwords easier to update at run time
#quarkus.security.users.embedded.realm-name=RegistryAdmin

#actual password below
# at runtime set environment variable
# QUARKUS_SECURITY_USERS_EMBEDDED_USERS__admin__ = betterpassword
quarkus.security.users.embedded.users."admin"=passwordchangeme
quarkus.security.users.embedded.roles."admin"=update

#image build
quarkus.container-image.name=publishing-registry

#k8s

#ingress - see https://quarkus.io/guides/deploying-to-kubernetes#exposing-your-application-in-kubernetes
quarkus.kubernetes.ingress.host=registry.localhost

%prod.quarkus.kubernetes-config.config-maps=registry-configmap
%prod.quarkus.kubernetes-config.enabled=true
%{dev,test}.quarkus.kubernetes-config.enabled=false
quarkus.helm.description="The IVOA registry implementation"
quarkus.helm.values.cron.paths=(kind == ConfigMap).data.'ivoa.registry.harvesting.cron'
quarkus.helm.values.cron.description="cron expression for harvesting (default is 2am every day)"

#graphql
quarkus.smallrye-graphql.ui.always-include=true

quarkus.rest-client.logging.scope=request-response
#irritatingly body limit 0 does not mean disable body logging, so set to 1 as workaround for minimal intrusion
quarkus.rest-client.logging.body-limit=1
quarkus.rest-client.extensions-api.scope=all
quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=DEBUG
quarkus.log.console.level=DEBUG

quarkus.banner.enabled=false
quarkus.analytics.disabled=true

# RofR (Registry of Registries) harvesting
# Set ivoa.harvesting.cron to a quarkus cron expression (e.g. "0 */10 * * * ?") to enable scheduled harvesting (setting to off will only harvest on request)
ivoa.harvesting.rofr.url=http://rofr.ivoa.net/oai
ivoa.harvesting.rofr.uselocal=true
# cron expression for harvesting (default is 2am every day)
#ivoa.harvesting.cron=0 0 2 * * ?
#use this for testing to harvest every 2 minutes 0 */2 * * * ?
ivoa.harvesting.cron=off

# Recursive source discovery settings
# Whether to discover child registries from harvested resource records
ivoa.harvesting.discovery.enabled=false
# Maximum total number of sources (including seed) that will be persisted
ivoa.harvesting.discovery.max-sources=100
# Maximum hop distance from the seed (0 = seed only, 1 = direct children, …)
ivoa.harvesting.discovery.max-depth=3
# Maximum number of new sources accepted in a single harvest run
ivoa.harvesting.discovery.max-per-run=5
# Whether to perform XML validation on harvested records from discovered sources (note switching this on will potentially lead errors from non-compliant sources and thus fewer harvested records)
ivoa.harvesting.discovery.doXMLValidation=false

# TAP setup
ivoa.tap.schema=RegTAP.vo-dml.tap.xml
# is the underlying database case sensitive
ivoa.tap.dbCaseSensitive=true
# number of registry records converted and persisted per batch when loading RegTAP
ivoa.tap.load.batch-size=30

# the timeout for the TAP sync endpoint, in seconds. If the query takes longer than this the server will timeout with an error VOTable response,
# which will contain a reference to the underlying UWS Job which can be queried for the results when they are ready.
# This is to prevent the server from being overloaded by long-running sync queries.

ivoa.tap.sync-timeout-seconds=5

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=true

#fix port
%dev.quarkus.datasource.devservices.port=54771

#default PU ORM setup - mainly for the TAPSchema
quarkus.hibernate-orm.packages=org.ivoa.dm,org.ivoa.vodml.stdtypes,org.javastro.ivoa.tap.entities,org.ivoa.dm.regtap
quarkus.hibernate-orm.quote-identifiers.strategy = all

# below is new quarkus
quarkus.hibernate-orm.schema-management.create-schemas=true
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
# this is for the scripts
quarkus.hibernate-orm.scripts.generation=drop-and-create
quarkus.hibernate-orm.scripts.generation.create-target=TAPddl.sql
quarkus.hibernate-orm.scripts.generation.drop-target=TAP_drop_ddl.sql
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=false


# quarkus-tap-lib contains base JAX-RS/CDI resource classes with interceptor annotations
# such as @Transactional. Index it so Quarkus can see those annotations at build time.
quarkus.index-dependency.quarkus-tap-lib.group-id=org.javastro.ivoa.core.quarkus
quarkus.index-dependency.quarkus-tap-lib.artifact-id=quarkus-tap-lib

quarkus.index-dependency.uws.group-id=org.javastro.ivoa.core
quarkus.index-dependency.uws.artifact-id=uws

# end of TAP setup


#force inclusion of ivoa entities
quarkus.index-dependency.ivoaent.group-id=org.javastro.ivoa
quarkus.index-dependency.ivoaent.artifact-id=ivoa-entities

quarkus.test.exclude-tags=integration

#As minikube does not support prometheus, disable prometheus by default - maybe control with either a profile or an env_var.
quarkus.kubernetes.prometheus.generate-service-monitor=${ENABLE_MONITORING:false}
