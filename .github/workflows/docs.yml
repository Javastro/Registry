name: Documentation

on:
  push:
    branches: [ "main" ]
    paths: [ "docs/**", "src/main/**", ".github/workflows/docs.yml" ]
  pull_request:
    paths: [ "docs/**", ".github/workflows/docs.yml" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: docs/requirements.txt
    - run: pip install -r docs/requirements.txt
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v4
    - name: Build documentation site (Sphinx + Javadoc incl. RegTAP classes)
      run: ./gradlew docsSite -Pregtap
    - uses: actions/upload-pages-artifact@v3
      with:
        path: build/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
